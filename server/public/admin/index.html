<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You &amp; Me — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- There is no login form here — admin.js checks GET /api/auth/session on load, and the
     server itself redirects anyone without an admin session to /login before this page even
     loads (see the /admin route in server.js). This shell only ever renders for a confirmed
     admin. The website's own /login page (you-and-me-site) is the single place anyone,
     customer or admin, signs in. -->
<div id="checkingSession" class="login-screen"><p style="color:#6B6259;">Checking session…</p></div>

<!-- ===== ADMIN APP SHELL ===== -->
<div id="adminApp" class="admin-app" hidden>
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">Y&amp;M</span>
      <span>You &amp; Me<br><small>Admin</small></span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" data-route="dashboard">📊 Dashboard</a>
      <a href="/admin/products" data-route="products">👕 Products</a>
      <a href="/admin/orders" data-route="orders">🧾 Orders</a>
      <a href="/admin/customers" data-route="customers">👤 Customers</a>
      <a href="/admin/inventory" data-route="inventory">📦 Inventory</a>
      <a href="/admin/shipping" data-route="shipping">🚚 Shipping</a>
      <a href="/admin/categories" data-route="categories">🏷️ Categories</a>
      <a href="/admin/media" data-route="media">🖼️ Media Library</a>
      <a href="/admin/settings" data-route="settings">⚙️ Settings</a>
    </nav>
    <button type="button" class="sidebar-logout" id="logoutBtn">🚪 Logout</button>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle menu">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="topbar-right">
        <span class="topbar-username" id="topbarUsername"></span>
        <button type="button" class="notif-bell" id="notifBell" aria-label="Notifications">
          🔔<span class="notif-dot" id="notifDot" hidden></span>
        </button>
      </div>
    </header>

    <main class="admin-content" id="adminContent"><!-- injected per route --></main>
  </div>
</div>

<div class="admin-scrim" id="adminScrim" hidden></div>
<div class="admin-modal" id="adminModal" hidden>
  <div class="admin-modal-inner">
    <button class="admin-modal-close" id="adminModalClose" aria-label="Close">&times;</button>
    <div id="adminModalBody"></div>
  </div>
</div>

<div class="toast-order" id="orderToast" hidden>
  <span class="toast-order-bell">🔔</span>
  <div>
    <strong>New Order Received</strong>
    <p id="orderToastBody"></p>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
